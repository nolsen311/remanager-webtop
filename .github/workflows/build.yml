name: Build and publish

on:
  schedule:
    # Poll for new reManager releases every 3 hours
    - cron: "0 */3 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - Dockerfile
      - rootfs/**
      - .github/workflows/build.yml

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/remanager-webtop

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether a build is needed
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag=$(gh api repos/rmitchellscott/reManager/releases/latest --jq .tag_name)
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # A manual run or a push (e.g. Dockerfile change) always rebuilds
          # the current upstream version. A scheduled poll only builds when
          # that version hasn't been published yet.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "${IMAGE}:${tag}" > /dev/null 2>&1; then
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.decide.outputs.build == 'true'
        uses: actions/checkout@v4

      - name: Set up QEMU
        if: steps.decide.outputs.build == 'true'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: steps.decide.outputs.build == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: steps.decide.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.decide.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            REMANAGER_VERSION=${{ steps.decide.outputs.tag }}
          tags: |
            ${{ env.IMAGE }}:${{ steps.decide.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
